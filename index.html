<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Training plan</title>
  <meta name="description" content="Semester strength and Muay Thai plan, Oct 5 to Dec 31, 2026, with a lift log and progress charts.">
  <meta name="theme-color" content="#F2F4F5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1220" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Training">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preload" href="assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/today">Training plan</a>
    <span class="sync-dot" id="syncState" role="img" hidden></span>
    <a class="icon-btn settings-link" href="#/settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </a>
  </header>

  <main id="main" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/today" data-tab="today">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="12" cy="15.5" r="1.8" class="fill"/></svg>
      <span>Today</span>
    </a>
    <a href="#/plan" data-tab="plan">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h5M9 13h5"/></svg>
      <span>Plan</span>
    </a>
    <a href="#/log" data-tab="log">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      <span>Log</span>
    </a>
    <a href="#/progress" data-tab="progress">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 4v16h16"/><path d="M8 15l3.5-4 3 2.5L19 8"/></svg>
      <span>Progress</span>
    </a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">This site needs JavaScript to show your plan and keep your log.</p></noscript>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
